spring.application.name=ClickNBuy

# ============================================================
# Server Properties
# ============================================================
server.port=${PORT:8080}

# ============================================================
# Database Properties (MySQL)
# Set DB_URL, DB_UN, DB_PWD as environment variables, OR
# edit the defaults below directly.
# ============================================================
spring.datasource.url=jdbc:${DB_URL:mysql://localhost:3306/clicknbuy?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_UN:root}
spring.datasource.password=${DB_PWD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Email Properties (Gmail SMTP)
# Use an App Password (not your real Gmail password).
# Generate at: https://myaccount.google.com/apppasswords
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL:your-email@gmail.com}
spring.mail.password=${APP_PWD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# Cloudinary (Image Upload)
# Get your URL from: https://cloudinary.com/console
# Format: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
# ============================================================
cloudinary.url=${CLOUDINARY_URL:cloudinary://your-api-key:your-api-secret@your-cloud-name}

# ============================================================
# Twilio (SMS OTP)
# Get credentials from: https://console.twilio.com
# If Twilio is not configured, OTP will be printed to console.
# ============================================================
twilio.sid=${TWILIO_ACCOUNT_SID:your-twilio-sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your-twilio-auth-token}
twilio.mobile=${TWILIO_MOBILE:+1234567890}

# ============================================================
# Razorpay (Payment Gateway)
# Get keys from: https://dashboard.razorpay.com/app/keys
# Use TEST mode keys for development.
# ============================================================
razorpay.id=${RAZORPAY_KEY_ID:your-razorpay-key-id}
razorpay.secret=${RAZORPAY_KEY_SECRET:your-razorpay-key-secret}
